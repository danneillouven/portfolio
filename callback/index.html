<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Last.fm authorization | Louven</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #fafafa;
        color: #12181c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-image:
          linear-gradient(rgba(18, 24, 28, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(18, 24, 28, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      main {
        width: min(100%, 34rem);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid #dedede;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 60px rgba(18, 24, 28, 0.1);
      }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: #0070f0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 2.4rem);
        line-height: 1.15;
      }

      .message {
        margin: 1rem 0 1.5rem;
        color: #56616a;
        line-height: 1.6;
      }

      .token-group {
        display: none;
        margin-bottom: 1.25rem;
      }

      .token-group.visible {
        display: block;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .token-row {
        display: flex;
        gap: 0.65rem;
      }

      output {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        padding: 0.75rem;
        border: 1px solid #d4d4d4;
        border-radius: 0.65rem;
        background: #f5f5f5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        font-size: 0.8rem;
      }

      button,
      .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        border-radius: 0.65rem;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 700;
      }

      button {
        padding: 0 1rem;
        border: 0;
        background: #0070f0;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #005fc9;
      }

      button:focus-visible,
      .home-link:focus-visible {
        outline: 3px solid rgba(0, 112, 240, 0.35);
        outline-offset: 3px;
      }

      .home-link {
        color: #0070f0;
        text-decoration: none;
      }

      .home-link:hover {
        text-decoration: underline;
      }

      .copy-status {
        min-height: 1.25rem;
        margin: 0.5rem 0 0;
        color: #56616a;
        font-size: 0.75rem;
      }

      @media (max-width: 32rem) {
        .token-row {
          align-items: stretch;
          flex-direction: column;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #080b0d;
          color: #f4f4f5;
        }

        body {
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        main {
          border-color: #26313a;
          background: rgba(12, 16, 19, 0.94);
          box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        .message,
        .copy-status {
          color: #a7b0b7;
        }

        output {
          border-color: #34414b;
          background: #12181c;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="callback-title">
      <p class="eyebrow">Last.fm</p>
      <h1 id="callback-title">Checking authorization…</h1>
      <p id="callback-message" class="message" aria-live="polite">
        Reading the authorization response.
      </p>

      <section id="token-group" class="token-group" aria-labelledby="token-label">
        <label id="token-label" for="token-value">Temporary authorization token</label>
        <div class="token-row">
          <output id="token-value" for="copy-token"></output>
          <button id="copy-token" type="button">Copy token</button>
        </div>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>

      <a class="home-link" href="/portfolio/">Return to portfolio</a>
    </main>

    <script>
      const parameters = new URLSearchParams(window.location.search);
      const token = parameters.get("token")?.trim();
      const title = document.querySelector("#callback-title");
      const message = document.querySelector("#callback-message");
      const tokenGroup = document.querySelector("#token-group");
      const tokenValue = document.querySelector("#token-value");
      const copyButton = document.querySelector("#copy-token");
      const copyStatus = document.querySelector("#copy-status");

      if (token) {
        title.textContent = "Authorization successful";
        message.textContent =
          "Last.fm returned a temporary token. Copy it now; authorization tokens expire after 60 minutes and can only be used once.";
        tokenValue.textContent = token;
        tokenGroup.classList.add("visible");

        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(token);
            copyButton.textContent = "Copied";
            copyStatus.textContent = "Token copied to your clipboard.";
          } catch {
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(tokenValue);
            selection.removeAllRanges();
            selection.addRange(range);
            copyStatus.textContent =
              "Automatic copying was unavailable. The token has been selected for you.";
          }
        });
      } else {
        title.textContent = "Authorization token missing";
        message.textContent =
          "Last.fm did not provide a token. Start the authorization process again and approve access before returning here.";
      }
    </script>
  </body>
</html>
